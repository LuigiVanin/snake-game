<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - WebAssembly</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            /* overflow: hidden; */
            /* font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; */
        }

        .game-container {
            padding: 15px;
            padding-bottom: 0px;
            text-align: center;
            width: 100%;
            max-width: 750px;
            padding-inline: 15px;
        }

        h1 {
            color: #000;
            margin: 0 0 20px 0;
        }


        .canvas-wrapper {
            width: 100%;
            max-width: 100%;
            background: #000;
            border-radius: 8px;
            min-height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .canvas-wrapper .reload-button {

            position: absolute;
            bottom: 10px;
            right: -30px;
            background: rgb(63, 63, 63);
            border-radius: 5px;
            cursor: pointer;
            color: white;
            border: none;
            height: 30px;
            width: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: right 0.3s ease-in-out;
        }

        .canvas-wrapper:hover .reload-button {
            right: 10px;
        }

        #canvas {
            display: block;
            margin: 0 auto;
            background: #000;
            /* width: 100%; */
            max-width: 100%;
            margin: 0 auto;
        }

        .controls {
            margin-top: 20px;
            color: #000;
            text-align: left;
            background: rgba(255, 255, 255, 0.1);
            padding-block: 15px;
            border-radius: 8px;

            display: flex;
            flex-direction: column;
            align-items: start;
            justify-items: center;

            border: 1px solid #000;
            padding-inline: 15px;
        }

        .controls-content {
            display: flex;
            flex-direction: column;
            align-items: start;
            justify-items: center;
        }

        .controls h3 {
            color: #000;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .controls p {
            margin: 5px 0;
            line-height: 1.6;
        }

        .controls kbd {
            background: #333;
            padding: 3px 8px;
            border-radius: 3px;
            border: 1px solid #666;
            font-family: monospace;
            font-weight: bold;
            color: #fff;
        }

        #output {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        .github-badge-wrapper {
            position: absolute;
            top: 0;
            right: 0;
            width: 200px;
            height: 200px;

            overflow: hidden;
        }

        a.github-badge {
            position: absolute;
            top: 0px;
            right: -70px;

            width: 200px;
            height: 60px;
            background: #000;
            transform: rotate(45deg);
            color: white;
            display: flex;

            align-items: center;
            justify-content: center;
            /* transform-origin: top right; */
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .mobile-warning {
            display: none;
        }

        #status {
            color: #fff;
            margin: 10px 0;
        }

        @media (max-width: 680px) {
            .game-container {
                display: none;;
            }

            .mobile-warning {
                display: block;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="mobile-warning">
        <h2>This game is not supported on mobile devices.</h2>
        <p>Please use a desktop browser to play.</p>
    
        <a href="https://github.com/LuigiVanin/snake-game" target="_blank">View on GitHub</a>
    </div>
    <div class="game-container">
        <h1>🐍 Snake Game</h1>
        
        <div id="status">
            <div class="spinner"></div>
            Loading game...
        </div>
        <div class="canvas-wrapper">
            <button class="reload-button" onclick="window.location.reload()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-clockwise" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z"/>
                    <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466"/>
                  </svg>
            </button>
            <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
        </div>
        
        <div class="controls">
            <h3>🎮 Controls</h3>
            <div class="controls-content">
                <p><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> Arrow keys to move</p>
                <p><kbd>Enter</kbd> Select menu options</p>
                <p><kbd>Space</kbd> Pause game</p>
            </div>
        </div >

        <!-- <div id="output"></div> -->
        <div class="github-badge-wrapper">
            <a class="github-badge" href="https://github.com/LuigiVanin/snake-game" target="_blank">
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" class="bi bi-github" viewBox="0 0 16 16">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/>
                  </svg>
            </a>
        </div>
    </div>

    <script type='text/javascript'>
        var statusElement = document.getElementById('status');
        var canvasElement = document.getElementById('canvas');
        
        var Module = {
            preRun: [],
            postRun: [],
            print: (function() {
                var element = document.getElementById('output');
                if (element) element.value = '';
                return function(text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log(text);
                    if (element) {
                        element.innerHTML += text + "\n";
                        element.scrollTop = element.scrollHeight;
                    }
                };
            })(),
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener("webglcontextlost", function(e) { 
                    alert('WebGL context lost. You will need to reload the page.'); 
                    e.preventDefault(); 
                }, false);
                return canvas;
            })(),
            setStatus: function(text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.last.text) return;
                var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                var now = Date.now();
                if (m && now - Module.setStatus.last.time < 30) return;
                Module.setStatus.last.time = now;
                Module.setStatus.last.text = text;
                if (m) {
                    text = m[1];
                }
                statusElement.innerHTML = text;
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
            }
        };
        Module.setStatus('Downloading...');
        window.onerror = function() {
            Module.setStatus('Exception thrown, see JavaScript console');
            Module.setStatus = function(text) {
                if (text) console.error('[post-exception status] ' + text);
            };
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
